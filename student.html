<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리그전 순위</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--navy:#002D62;--navy2:#003f8a;--red:#C8102E;--gold:#FFD700;
          --gray1:#F2F4F7;--gray2:#DDE1E9;--gray3:#8B95A1;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;
         background:var(--gray1);min-height:100vh;}

    .header{background:linear-gradient(135deg,var(--navy),var(--navy2));
            color:white;padding:18px 16px;text-align:center;}
    .header h1{font-size:1.2em;font-weight:900;margin-bottom:4px;}
    .header .sub{font-size:0.78em;opacity:.75;}

    /* 코드 입력 화면 */
    .code-wrap{max-width:360px;margin:40px auto;padding:0 16px;}
    .code-card{background:white;border-radius:16px;padding:28px 24px;
               box-shadow:0 4px 20px rgba(0,45,98,.12);text-align:center;}
    .code-icon{font-size:2.5em;margin-bottom:12px;}
    .code-title{font-size:1em;font-weight:900;color:var(--navy);margin-bottom:6px;}
    .code-sub{font-size:0.82em;color:var(--gray3);margin-bottom:24px;line-height:1.5;}
    .code-input{
      width:100%;height:64px;font-size:2em;font-weight:900;
      text-align:center;letter-spacing:.3em;
      border:3px solid var(--gray2);border-radius:12px;
      color:var(--navy);background:white;
      -webkit-appearance:none;appearance:none;
    }
    .code-input:focus{outline:none;border-color:var(--navy2);}
    .code-input.error{border-color:var(--red);animation:shake .3s ease;}
    @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
    .code-error{font-size:0.82em;color:var(--red);font-weight:700;
                margin-top:10px;min-height:1.2em;}
    .btn-enter{width:100%;padding:14px;background:var(--navy);color:white;
               border:none;border-radius:10px;font-size:1em;font-weight:800;
               cursor:pointer;margin-top:14px;}
    .btn-enter:active{opacity:.85;}

    /* 순위 화면 */
    .back-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;
              background:white;border-bottom:1px solid var(--gray2);}
    .btn-back{padding:7px 14px;background:var(--gray1);color:var(--navy);
              border:1.5px solid var(--gray2);border-radius:20px;
              font-size:0.8em;font-weight:800;cursor:pointer;}
    .league-title-bar{font-size:0.9em;font-weight:800;color:var(--navy);}

    .stat-row{display:flex;gap:10px;padding:14px 16px 0;}
    .stat-box{flex:1;background:white;border-radius:10px;padding:12px 8px;
              text-align:center;box-shadow:0 2px 12px rgba(0,45,98,.1);}
    .stat-num{font-size:1.5em;font-weight:900;color:var(--navy);line-height:1;}
    .stat-label{font-size:0.68em;color:var(--gray3);font-weight:600;margin-top:3px;}

    .rank-wrap{padding:14px 16px;}
    .rank-table-wrap{overflow-x:auto;border-radius:10px;
                     box-shadow:0 2px 12px rgba(0,45,98,.1);}
    table.rank-table{width:100%;border-collapse:collapse;background:white;
                     font-size:0.9em;min-width:300px;}
    table.rank-table thead tr{background:var(--navy);color:white;}
    table.rank-table th{padding:12px 8px;text-align:center;font-weight:700;
                        font-size:0.8em;white-space:nowrap;}
    table.rank-table td{padding:11px 8px;text-align:center;
                        border-bottom:1px solid var(--gray1);white-space:nowrap;}
    table.rank-table tbody tr:last-child td{border-bottom:none;}
    .rank-1st{background:linear-gradient(90deg,#FFFDE7,white)!important;}
    .rank-2nd{background:linear-gradient(90deg,#F5F5F5,white)!important;}
    .rank-3rd{background:linear-gradient(90deg,#FFF3E0,white)!important;}
    .td-name{text-align:left;font-weight:800;padding-left:14px;}
    .th-name{text-align:left;padding-left:14px;}
    .pts-badge{display:inline-block;background:var(--navy);color:white;
               border-radius:20px;padding:3px 10px;font-weight:800;font-size:0.88em;}
    .rank-empty{text-align:center;padding:32px 16px;color:var(--gray3);font-size:0.9em;}

    .refresh-bar{text-align:center;padding:14px 16px;}
    .btn-refresh{padding:10px 24px;background:white;color:var(--navy);
                 border:2px solid var(--navy);border-radius:20px;
                 font-size:0.85em;font-weight:800;cursor:pointer;}
    .btn-refresh:active{background:var(--navy);color:white;}
    .last-update{text-align:center;font-size:0.72em;color:var(--gray3);padding-bottom:24px;}

    .loading{text-align:center;padding:40px 16px;color:var(--gray3);}
    .spinner{display:inline-block;width:32px;height:32px;
             border:3px solid var(--gray2);border-top-color:var(--navy);
             border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px;}
    @keyframes spin{to{transform:rotate(360deg);}}

    .screen{display:none;}
    .screen.active{display:block;}
  </style>
</head>
<body>

<div class="header">
  <h1>🏆 리그전 순위</h1>
  <div class="sub" id="header-sub">수업 코드를 입력해 주세요</div>
</div>

<!-- ── 화면 1: 코드 입력 ── -->
<div class="screen active" id="screen-code">
  <div class="code-wrap">
    <div class="code-card">
      <div class="code-icon">🔑</div>
      <div class="code-title">수업 코드 입력</div>
      <div class="code-sub">선생님이 알려주신 4자리 코드를<br>입력하면 순위를 볼 수 있어요</div>
      <input class="code-input" id="code-input" type="text"
        maxlength="4" inputmode="numeric" placeholder="0000"
        onkeydown="if(event.key==='Enter') doEnterCode()"
        oninput="this.classList.remove('error')">
      <div class="code-error" id="code-error"></div>
      <div id="code-choice" style="display:none;margin-top:6px;"></div>
      <button class="btn-enter" onclick="doEnterCode()">순위 보기 →</button>
    </div>
    <div style="text-align:center;margin-top:18px;">
      <a href="index.html" style="display:inline-block;padding:8px 16px;font-size:0.78em;font-weight:700;color:var(--gray3);text-decoration:none;border:1.5px solid var(--gray2);border-radius:20px;background:white;">👨‍🏫 교사 로그인</a>
    </div>
  </div>
</div>

<!-- ── 화면 2: 순위표 ── -->
<div class="screen" id="screen-rank">
  <div class="back-bar">
    <button class="btn-back" id="btn-back-code" onclick="goBack()">← 코드 재입력</button>
    <span class="league-title-bar" id="rank-league-title"></span>
  </div>

  <div class="stat-row">
    <div class="stat-box"><div class="stat-num" id="s-done">-</div><div class="stat-label">완료 경기</div></div>
    <div class="stat-box"><div class="stat-num" id="s-remain">-</div><div class="stat-label">남은 경기</div></div>
    <div class="stat-box"><div class="stat-num" id="s-players">-</div><div class="stat-label" id="s-players-label">참가 선수</div></div>
  </div>

  <div class="rank-wrap">
    <div id="rank-area">
      <div class="loading"><div class="spinner"></div><br>불러오는 중...</div>
    </div>
  </div>

  <div class="refresh-bar">
    <button class="btn-refresh" onclick="loadRankings()">↻ 새로고침</button>
  </div>
  <div class="last-update" id="last-update"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
// ════════════════════════════════════════════════════════
//  리그전 순위 (학생용) — Firebase 버전 · 로그인 없이 읽기 전용
//  수업 문서 1개만 읽어서 순위를 보여주므로 사용량이 아주 적어요.
// ════════════════════════════════════════════════════════
var _serverLeagueParam = LG.param("league");
var _curLeagueKey  = "";
var _curLeagueName = "";
var _curMode       = "individual";
var _directLink    = false;
var _unsub         = null;
var _db            = null;

window.onload = function() {
  if (!LG.configOk()) { LG.init(); return; }
  if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  _db = firebase.firestore();
  if (_serverLeagueParam) {
    _directLink = true;
    enterByDirectLink(_serverLeagueParam);
  } else {
    setTimeout(function(){ document.getElementById("code-input").focus(); }, 300);
  }
};

function leagueCol() { return _db.collection(LG.COL_LEAGUES); }

// ── QR에 수업이 직접 지정된 경우 — 코드 입력 없이 바로 그 수업 순위로 이동 ──
function enterByDirectLink(leagueKey) {
  leagueCol().doc(leagueKey).get().then(function(doc) {
    if (!doc.exists || doc.data().deleted) { fallbackToCode(); return; }
    var d = doc.data();
    enterLeague({ leagueKey: doc.id, leagueName: d.name, mode: d.mode || "individual" });
    var backBtn = document.getElementById("btn-back-code");
    if (backBtn) backBtn.style.display = "none";
  }).catch(fallbackToCode);
}
function fallbackToCode() {
  _directLink = false;
  setTimeout(function(){ document.getElementById("code-input").focus(); }, 300);
}

// ── 코드 입력 → 같은 코드를 쓰는 수업 찾기 ──
function doEnterCode() {
  var code = document.getElementById("code-input").value.trim();
  if (code.length < 4) { showCodeError("4자리 코드를 입력해 주세요."); return; }
  document.getElementById("code-error").textContent = "확인 중...";
  document.getElementById("code-error").style.color = "var(--gray3)";
  hideCodeChoice();

  leagueCol().where("code", "==", code).get().then(function(snap) {
    var matches = [];
    snap.forEach(function(d) {
      var l = d.data();
      if (l.deleted) return;
      matches.push({ leagueKey: d.id, leagueName: l.name, mode: l.mode || "individual" });
    });
    if (!matches.length) { showCodeError("코드가 올바르지 않습니다. 선생님께 확인하세요."); return; }
    document.getElementById("code-error").textContent = "";
    if (matches.length === 1) enterLeague(matches[0]); else showLeagueChoice(matches);
  }).catch(function() { showCodeError("오류가 발생했습니다. 다시 시도해 주세요."); });
}

function showLeagueChoice(matches) {
  window._pendingMatches = matches;
  var container = document.getElementById("code-choice");
  container.innerHTML = matches.map(function(m, i){
    var modeLabel = m.mode==="team" ? "👥 단체전" : "👤 개인전";
    return '<button class="btn-enter" style="background:white;color:var(--navy);border:2px solid var(--navy);margin-top:8px;" onclick="chooseLeagueMatch('+i+')">'+esc(m.leagueName)+' · '+modeLabel+'</button>';
  }).join("");
  container.style.display = "block";
  document.getElementById("code-error").textContent = "같은 코드를 쓰는 수업이 여러 개예요. 골라주세요.";
  document.getElementById("code-error").style.color = "var(--gray3)";
}

function hideCodeChoice() {
  var container = document.getElementById("code-choice");
  container.style.display = "none";
  container.innerHTML = "";
}

function chooseLeagueMatch(i) {
  var m = (window._pendingMatches || [])[i];
  if (!m) return;
  hideCodeChoice();
  enterLeague(m);
}

function enterLeague(m) {
  _curLeagueKey  = m.leagueKey;
  _curLeagueName = m.leagueName;
  _curMode       = m.mode || "individual";
  document.getElementById("rank-league-title").textContent = m.leagueName;
  document.getElementById("header-sub").textContent = m.leagueName + " 순위";
  document.getElementById("s-players-label").textContent = _curMode==="team" ? "참가 팀" : "참가 선수";
  showScreen("screen-rank");
  loadRankings();
}

function showCodeError(msg) {
  var inp = document.getElementById("code-input");
  var err = document.getElementById("code-error");
  inp.classList.add("error");
  err.textContent   = "⚠️ " + msg;
  err.style.color   = "var(--red)";
  inp.select();
}

function goBack() {
  stopListen();
  document.getElementById("code-input").value = "";
  document.getElementById("code-error").textContent = "";
  hideCodeChoice();
  showScreen("screen-code");
  document.getElementById("header-sub").textContent = "수업 코드를 입력해 주세요";
  setTimeout(function(){ document.getElementById("code-input").focus(); }, 200);
}

// ── 순위 로드 — 실시간 연결 (선생님이 점수를 입력하면 자동으로 바뀜) ──
function stopListen() { if (_unsub) { _unsub(); _unsub = null; } }

function loadRankings() {
  stopListen();
  document.getElementById("rank-area").innerHTML =
    '<div class="loading"><div class="spinner"></div><br>불러오는 중...</div>';
  var key = _curLeagueKey;
  _unsub = leagueCol().doc(key).onSnapshot(function(doc) {
    if (key !== _curLeagueKey) return;
    if (!doc.exists || doc.data().deleted) {
      document.getElementById("rank-area").innerHTML =
        '<div class="rank-empty">⚠️ 수업을 찾을 수 없습니다.</div>';
      return;
    }
    var d = doc.data(), st = d.stats || {};
    _curMode = d.mode || _curMode;
    document.getElementById("s-players-label").textContent = _curMode==="team" ? "참가 팀" : "참가 선수";
    renderRankings(st.rankings || [], st.done || 0, st.total || 0);
    document.getElementById("last-update").textContent =
      "마지막 업데이트: " + new Date().toLocaleTimeString("ko-KR");
  }, function() {
    document.getElementById("rank-area").innerHTML =
      '<div class="rank-empty">⚠️ 오류가 발생했습니다.<br>새로고침 해주세요.</div>';
  });
}

function renderRankings(rankings, done, total) {
  document.getElementById("s-done").textContent    = done;
  document.getElementById("s-remain").textContent  = total - done;
  document.getElementById("s-players").textContent = rankings.length;

  if (!rankings.length) {
    document.getElementById("rank-area").innerHTML =
      '<div class="rank-empty">아직 완료된 경기가 없습니다.<br>경기가 끝나면 여기에 순위가 나타납니다.</div>';
    return;
  }

  var medals = ["🥇","🥈","🥉"];
  var html = '<div class="rank-table-wrap"><table class="rank-table">' +
    '<thead><tr><th>순위</th><th class="th-name" id="th-name-label">' + (_curMode==="team" ? "팀명" : "이름") + '</th>' +
    '<th>경기</th><th>승</th><th>패</th><th>득실</th><th>승점</th></tr></thead><tbody>';

  rankings.forEach(function(p) {
    var trCls = p.rank===1?"rank-1st":p.rank===2?"rank-2nd":p.rank===3?"rank-3rd":"";
    var medal = p.rank<=3 ? medals[p.rank-1] : p.rank+"위";
    var diff  = p.diff>0
      ? '<span style="color:#2E7D32;font-weight:800;">+'+p.diff+'</span>'
      : p.diff<0
        ? '<span style="color:#C8102E;font-weight:800;">'+p.diff+'</span>'
        : '0';
    html += '<tr class="'+trCls+'">' +
      '<td>'+medal+'</td>' +
      '<td class="td-name">'+esc(p.name)+'</td>' +
      '<td>'+p.games+'</td>' +
      '<td style="color:#1565C0;font-weight:800;">'+p.w+'</td>' +
      '<td style="color:#C8102E;">'+p.l+'</td>' +
      '<td>'+diff+'</td>' +
      '<td><span class="pts-badge">'+p.pts+'</span></td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById("rank-area").innerHTML = html;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

function esc(s) { return LG.esc(s); }
</script>
</body>
</html>
